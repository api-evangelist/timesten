aid: timesten
name: TimesTen
description: TimesTen is an in-memory relational database company that spun out of Hewlett-Packard Labs in Palo
  Alto in 1996 as TimesTen Performance Software, taking venture backing that included Lightspeed Venture Partners,
  and was acquired by Oracle Corporation in 2005. The product lives on as Oracle TimesTen In-Memory Database, a
  persistent, ACID-compliant OLTP database with SQL support, replication, JSON support, and a Kubernetes operator,
  documented today under Oracle Help Center with releases 11.2.2, 18.1, 22.1, and 26.1. The company no longer operates
  independently and publishes no standalone web API; timesten.com redirects into oracle.com.
